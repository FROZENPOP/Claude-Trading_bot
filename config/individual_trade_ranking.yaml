# Configuration for Phase 5: Individual Trade Ranking
# This file controls the parameters for ranking individual trades

individual_trade_ranking:
  # Minimum risk/reward ratio for acceptable trades
  min_risk_reward_ratio: 2.0

  # Maximum portfolio risk per trade (as fraction of portfolio value)
  max_risk_per_trade: 0.02  # 2% max risk per trade

  # Minimum win rate for acceptable trades
  min_win_rate: 0.6  # 60% minimum win rate

  # Maximum correlation with existing positions
  max_correlation: 0.7  # 70% max correlation

  # Minimum daily dollar volume for liquidity consideration
  liquidity_threshold: 1000000  # $1M daily volume

  # Maximum number of trades to return for Phase 6
  max_trades: 5

  # Scoring weights (must sum to 1.0)
  scoring_weights:
    trade_quality: 0.40  # 40% weight for trade quality
    risk_management: 0.25  # 25% weight for risk management
    portfolio_context: 0.20  # 20% weight for portfolio context
    liquidity: 0.15  # 15% weight for liquidity

  # Quality thresholds for filtering
  quality_thresholds:
    min_overall_score: 0.5  # Minimum 50% overall trade score
    min_risk_score: 0.4     # Minimum 40% risk management score
    min_liquidity_score: 0.3  # Minimum 30% liquidity score